# Publishes wiki/ as this repository's GitHub wiki, on every push to main
# that changes it. The wiki is a copy: edit wiki/, never the wiki on GitHub,
# whose pages this replaces. See wiki/Home.md, "Using these pages on GitHub".
name: Wiki

on:
  push:
    branches: [main]
    paths:
      - wiki/**
      - tools/wiki.mjs
      - .github/workflows/wiki.yml
  workflow_dispatch:

permissions:
  contents: write                          # pushing to the wiki's git repository

concurrency:
  group: wiki

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the links
        run: node tools/wiki.mjs

      - name: Clone the wiki
        env:
          TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki" || {
            echo "::error::The wiki has no git repository until its first page exists. On GitHub, open Wiki, create the first page and save it, then run this workflow again."
            exit 1
          }

      - name: Write the pages
        run: node tools/wiki.mjs "$RUNNER_TEMP/wiki"

      - name: Push
        working-directory: ${{ runner.temp }}/wiki
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki already matches wiki/."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Publish wiki/ from ${GITHUB_SHA::7}"
          git push
